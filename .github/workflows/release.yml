name: Release

# A tag v<version> builds the installers and portable apps for Windows, macOS (Apple silicon and Intel) and Linux and
# publishes them together as a GitHub Release. Running the workflow by hand (Actions -> Release -> Run workflow) builds
# the same files as workflow artifacts without releasing them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      matrix:
        include:
          - { platform: windows-x64, os: windows-latest }
          - { platform: macos-arm64, os: macos-latest }
          - { platform: macos-x64, os: macos-15-intel }
          - { platform: linux-x64, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash # Git Bash on Windows
    steps:
      - uses: actions/checkout@v7

      # Runs Gradle, and is also the Temurin 25 toolchain that jpackage takes the bundled runtime from.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Install WiX
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet tool install --global wix --version 5.0.2
          $wix = "$env:USERPROFILE\.dotnet\tools\wix.exe"
          & $wix extension add -g WixToolset.Util.wixext/5.0.2
          & $wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Install fakeroot and rpmbuild
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes fakeroot rpm

      - name: Check version
        run: |
          version=$(./gradlew -q properties --property version | tr -d '\r' | sed -n 's/^version: *//p')
          if [ -z "$version" ]; then echo "::error::Could not read the version from Gradle"; exit 1; fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in build.gradle.kts"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew test jpackageInstaller

      # GitHub replaces spaces in release file names with dots, so name the files without spaces.
      - name: Collect files (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item "build\jpackage\installer\PDF Sign Tool-$env:VERSION.msi" "dist\PDF-Sign-Tool-$env:VERSION.msi"
          Compress-Archive "build\jpackage\image\PDF Sign Tool" "dist\PDF-Sign-Tool-$env:VERSION-windows-portable.zip"

      - name: Collect files (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir dist
          cp "build/jpackage/installer/PDF Sign Tool-$VERSION.dmg" "dist/PDF-Sign-Tool-$VERSION-${{ matrix.platform }}.dmg"

      - name: Collect files (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          tar -czf "dist/PDF-Sign-Tool-$VERSION-${{ matrix.platform }}.tar.gz" -C build/jpackage/image "PDF Sign Tool"
          cp build/jpackage/installer/*.deb dist/
          # jpackage builds one package type per run
          ./gradlew jpackageInstaller -PinstallerType=rpm
          cp build/jpackage/installer/*.rpm dist/

      - uses: actions/upload-artifact@v7
        with:
          name: PDF-Sign-Tool-${{ env.VERSION }}-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  # Only after every platform built, so a release never misses files.
  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "PDF Sign Tool ${GITHUB_REF_NAME#v}"
