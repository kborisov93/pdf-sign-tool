# Dark theme colours of the application; see FlatLaf.properties. Status colours follow Windows 11.

# A lighter blue keeps focus rings and selections visible on the dark background.
@accentColor = #2b7bd4
@background = #202020
# Dimmer than FlatLaf's default, so that a disabled Sign button does not look like an enabled one.
@disabledForeground = #787878

PdfSign.secondaryForeground = #b4b4b4
PdfSign.cardBackground = #2b2b2b
PdfSign.cardBorderColor = #3a3a3a
PdfSign.footerBackground = #1a1a1a
PdfSign.footerBorderColor = #2f2f2f
PdfSign.selectionBackground = #2f3d4f
PdfSign.iconGlyphColor = #000

PdfSign.infoColor = #6cb2ff
PdfSign.infoBackground = #26303c
PdfSign.successColor = #6ccb5f
PdfSign.successBackground = #393d1b
PdfSign.warningColor = #fce100
PdfSign.warningBackground = #433519
PdfSign.errorColor = #ff99a4
PdfSign.errorBackground = #442726
