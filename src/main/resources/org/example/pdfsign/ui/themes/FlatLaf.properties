# Customisations of FlatLaf's light and dark themes, registered in Theme.kt.
# Keys starting with "PdfSign." are the application's own colours; FlatLightLaf.properties and FlatDarkLaf.properties
# define them for each theme.

Button.arc = 8
Component.arc = 8
TextComponent.arc = 8
CheckBox.arc = 6
ScrollPane.arc = 8
ProgressBar.arc = 4

# The default button (Sign, Save) is filled with the accent colour, as in Windows 11.
Button.default.background = @accentColor
Button.default.foreground = #fff
Button.default.focusedBackground = $Button.default.background
Button.default.hoverBackground = darken($Button.default.background,5%,derived)
Button.default.pressedBackground = darken($Button.default.background,10%,derived)
Button.default.borderColor = $Button.default.background
Button.default.hoverBorderColor = $Button.default.hoverBackground
Button.default.focusedBorderColor = $Component.focusedBorderColor
Button.default.borderWidth = 1
