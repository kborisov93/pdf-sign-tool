# Light theme colours of the application; see FlatLaf.properties. Status colours follow Windows 11.

# The blue of the application icon.
@accentColor = #1565c0

PdfSign.secondaryForeground = #5d5d5d
PdfSign.cardBackground = #fff
PdfSign.cardBorderColor = #e0e0e0
PdfSign.footerBackground = #e9e9e9
PdfSign.footerBorderColor = #dadada
PdfSign.selectionBackground = #e1ebf7
PdfSign.iconGlyphColor = #fff

PdfSign.infoColor = @accentColor
PdfSign.infoBackground = #ebf2fa
PdfSign.successColor = #0f7b0f
PdfSign.successBackground = #dff6dd
PdfSign.warningColor = #9d5d00
PdfSign.warningBackground = #fff4ce
PdfSign.errorColor = #c42b1c
PdfSign.errorBackground = #fde7e9
